# .github/workflows/android-dev.yml
# Android 13 CI — Galaxy S23 device profile
# REQUIRED: add VNC_PASS to repo Secrets  →  Settings → Secrets and variables → Actions
# OPTIONAL: add NGROK_TOKEN to use ngrok instead of localhost.run

name: android-dev
on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Session minutes'
        default: '480'
        required: false

env:
  ASDK: /opt/asdk
  AVD: s23dev
  API: "33"
  ABI: x86_64
  FLAVOR: google_apis
  NDK_VER: "25.2.9519653"

jobs:
  device:
    runs-on: ubuntu-22.04
    timeout-minutes: 490

    steps:
      - uses: actions/checkout@v4

      - name: install-packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-kvm \
            libvirt-clients \
            xvfb \
            x11vnc \
            novnc \
            python3-websockify \
            nginx \
            apache2-utils \
            curl \
            wget \
            unzip \
            openjdk-17-jdk-headless \
            e2fsprogs \
            openssh-client

          # simg2img / img2simg
          sudo apt-get install -y -qq android-sdk-libsparse-utils 2>/dev/null || \
          sudo apt-get install -y -qq btrfs-progs 2>/dev/null || true

      - name: enable-kvm
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 777 /dev/kvm

      - name: sdk-setup
        run: |
          mkdir -p "$ASDK/cmdline-tools"
          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" \
            -O /tmp/ct.zip
          unzip -q /tmp/ct.zip -d /tmp/ct
          mv /tmp/ct/cmdline-tools "$ASDK/cmdline-tools/latest"
          rm -rf /tmp/ct /tmp/ct.zip

          printf '%s\n' \
            "$ASDK/cmdline-tools/latest/bin" \
            "$ASDK/emulator" \
            "$ASDK/platform-tools" \
            "$ASDK/ndk/$NDK_VER/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            >> "$GITHUB_PATH"

          echo "ANDROID_SDK_ROOT=$ASDK" >> "$GITHUB_ENV"

          # Must use absolute path — GITHUB_PATH only applies to subsequent steps
          SDKM="$ASDK/cmdline-tools/latest/bin/sdkmanager"

          yes | ANDROID_SDK_ROOT="$ASDK" "$SDKM" --licenses > /dev/null 2>&1 || true

          ANDROID_SDK_ROOT="$ASDK" "$SDKM" \
            "platform-tools" \
            "emulator" \
            "ndk;$NDK_VER" \
            "system-images;android-$API;$FLAVOR;$ABI"

      # Build Adreno 740 spoof library using Android NDK (x86_64-android target)
      - name: build-gpu-spoof
        run: |
          python3 << 'PY'
          lines = [
              "#define _GNU_SOURCE",
              "#include <dlfcn.h>",
              "#include <stdint.h>",
              "typedef uint32_t GLenum;",
              "typedef uint8_t  GLubyte;",
              "#define GL_VENDOR                   0x1F00u",
              "#define GL_RENDERER                 0x1F01u",
              "#define GL_VERSION                  0x1F02u",
              "#define GL_SHADING_LANGUAGE_VERSION 0x8B8Cu",
              "typedef const GLubyte *(*fn_t)(GLenum);",
              "static fn_t _r;",
              "__attribute__((constructor)) static void _i(void) {",
              '    _r = (fn_t)dlsym(RTLD_NEXT, "glGetString");',
              "}",
              "const GLubyte *glGetString(GLenum n) {",
              "    switch (n) {",
              '    case GL_VENDOR:   return (const GLubyte *)"Qualcomm";',
              '    case GL_RENDERER: return (const GLubyte *)"Adreno (TM) 740";',
              '    case GL_VERSION:',
              '        return (const GLubyte *)',
              '            "OpenGL ES 3.2 V@0530.0 (GIT@87d3861, Ie8db531a16, 1662551516) (Date:12/06/22)";',
              "    case GL_SHADING_LANGUAGE_VERSION:",
              '        return (const GLubyte *)"OpenGL ES GLSL ES 3.20";',
              "    default:",
              '        return _r ? _r(n) : (const GLubyte *)"";',
              "    }",
              "}",
          ]
          with open('/tmp/gpu_spoof.c', 'w') as f:
              f.write('\n'.join(lines) + '\n')
          PY

          CLANG="$ASDK/ndk/$NDK_VER/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android33-clang"
          "$CLANG" -shared -fPIC -O2 -o /tmp/libgpu_spoof.so /tmp/gpu_spoof.c
          file /tmp/libgpu_spoof.so

      # Copy SDK sysdir, modify system.img: S23 build.prop + LD_PRELOAD injection
      - name: prepare-sysdir
        run: |
          SDK_DIR="$ASDK/system-images/android-$API/$FLAVOR/$ABI"
          WORK_DIR="/tmp/sysdir"
          mkdir -p "$WORK_DIR"
          cp -a "$SDK_DIR"/. "$WORK_DIR/"

          SYSIMG="$WORK_DIR/system.img"

          # Sparse ext4 → raw (graceful fallback)
          simg2img "$SYSIMG" /tmp/sys_raw.img 2>/dev/null \
            || cp "$SYSIMG" /tmp/sys_raw.img

          # Grow by 128 MB to make room for injected files
          dd if=/dev/zero bs=1M count=128 >> /tmp/sys_raw.img 2>/dev/null
          e2fsck -fy /tmp/sys_raw.img > /dev/null 2>&1 || true
          resize2fs /tmp/sys_raw.img > /dev/null 2>&1 || true

          # All image modifications in one Python block
          python3 << 'PY'
          import subprocess, os

          img = '/tmp/sys_raw.img'

          def dbfs_read(remote, local):
              subprocess.run(
                  ['debugfs', '-R', f'dump {remote} {local}', img],
                  capture_output=True,
              )

          def dbfs_cmd(cmds):
              subprocess.run(
                  ['debugfs', '-w', img],
                  input=(cmds + '\n').encode(),
                  capture_output=True,
              )

          # --- build.prop: append S23 fingerprint ---
          dbfs_read('/build.prop', '/tmp/bp.prop')
          if os.path.exists('/tmp/bp.prop'):
              s23 = [
                  '',
                  '# Samsung Galaxy S23 (SM-S911B) overlay',
                  'ro.product.brand=samsung',
                  'ro.product.manufacturer=samsung',
                  'ro.product.model=SM-S911B',
                  'ro.product.name=SM-S911B',
                  'ro.product.device=dm3q',
                  'ro.build.product=dm3q',
                  'ro.board.platform=kalama',
                  'ro.hardware=qcom',
                  'ro.product.cpu.abi=arm64-v8a',
                  'ro.product.cpu.abilist=arm64-v8a,armeabi-v7a,armeabi',
                  'ro.product.cpu.abilist32=armeabi-v7a,armeabi',
                  'ro.product.cpu.abilist64=arm64-v8a',
                  ('ro.build.fingerprint=samsung/SM-S911BXXU5CWJ1/SM-S911B:13'
                   '/TP1A.220624.014/S911BXXU5CWJ1:user/release-keys'),
                  'ro.build.version.release=13',
                  'ro.build.version.sdk=33',
                  'ro.hardware.gpu=adreno',
                  'ro.board.egl=adreno',
              ]
              with open('/tmp/bp.prop', 'a') as f:
                  f.write('\n'.join(s23) + '\n')
              dbfs_cmd('rm /build.prop\nwrite /tmp/bp.prop /build.prop')

          # --- Inject GPU spoof library ---
          dbfs_cmd(
              'mkdir /lib64\n'
              'write /tmp/libgpu_spoof.so /lib64/libgpu_spoof.so\n'
              'write /tmp/libgpu_spoof.so /lib/libgpu_spoof.so'
          )

          # --- Patch zygote init: inject LD_PRELOAD ---
          rc_targets = [
              '/etc/init/zygote64.rc',
              '/etc/init/zygote64_32.rc',
          ]
          for remote in rc_targets:
              local = f'/tmp/{os.path.basename(remote)}'
              dbfs_read(remote, local)
              if not os.path.exists(local):
                  continue
              with open(local) as f:
                  c = f.read()
              # Insert setenv right after "class main"
              patched = c.replace(
                  'class main\n',
                  'class main\n    setenv LD_PRELOAD /system/lib64/libgpu_spoof.so\n',
                  1,
              )
              patch_path = local + '.patch'
              with open(patch_path, 'w') as f:
                  f.write(patched)
              dbfs_cmd(f'rm {remote}\nwrite {patch_path} {remote}')

          print('System image modifications complete.')
          PY

          # Repack sparse (fall back to raw copy)
          img2simg /tmp/sys_raw.img "$SYSIMG" 2>/dev/null \
            || cp /tmp/sys_raw.img "$SYSIMG"
          rm -f /tmp/sys_raw.img

      - name: create-avd
        run: |
          echo "no" | avdmanager create avd \
            -n "$AVD" \
            -k "system-images;android-$API;$FLAVOR;$ABI" \
            -d pixel_6 \
            --force 2>&1 | tail -3

          python3 << 'PY'
          import os
          avd = os.environ.get('AVD', 's23dev')
          cfg_path = os.path.expanduser(f'~/.android/avd/{avd}.avd/config.ini')

          overrides = {
              'hw.cpu.ncore': '4',
              'hw.ramSize': '8192',
              'hw.gpu.enabled': 'yes',
              'hw.gpu.mode': 'swiftshader_indirect',
              'hw.lcd.width': '1080',
              'hw.lcd.height': '2340',
              'hw.lcd.density': '450',
              'hw.device.name': 'Samsung Galaxy S23',
              'hw.device.manufacturer': 'Samsung',
              'skin.name': '1080x2340',
              'skin.path': '_no_skin',
              'showDeviceFrame': 'no',
              'PlayStore.enabled': 'false',
          }

          with open(cfg_path) as f:
              lines = f.readlines()
          existing = {l.split('=')[0].strip() for l in lines if '=' in l}

          with open(cfg_path, 'a') as f:
              for k, v in overrides.items():
                  if k not in existing:
                      f.write(f'{k}={v}\n')
          print(f'AVD config updated: {cfg_path}')
          PY

      - name: start-xvfb
        run: |
          Xvfb :99 -screen 0 1200x2600x32 -ac +extension GLX &
          sleep 2
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: start-emulator
        run: |
          DISPLAY=:99 emulator \
            -avd "$AVD" \
            -sysdir /tmp/sysdir \
            -no-audio \
            -no-boot-anim \
            -no-snapshot-load \
            -no-snapshot-save \
            -gpu swiftshader_indirect \
            -memory 8192 \
            -cores 4 \
            -accel on \
            -wipe-data \
            -camera-back none \
            -camera-front none \
            -prop "ro.product.brand=samsung" \
            -prop "ro.product.manufacturer=samsung" \
            -prop "ro.product.model=SM-S911B" \
            -prop "ro.product.name=SM-S911B" \
            -prop "ro.product.device=dm3q" \
            -prop "ro.board.platform=kalama" \
            -prop "ro.hardware=qcom" \
            -prop "ro.build.version.release=13" \
            -prop "ro.build.version.sdk=33" \
            -prop "ro.hardware.gpu=adreno" \
            -prop "ro.build.fingerprint=samsung/SM-S911BXXU5CWJ1/SM-S911B:13/TP1A.220624.014/S911BXXU5CWJ1:user/release-keys" \
            -port 5554 \
            &

          printf 'Waiting for boot'
          DEADLINE=$(( SECONDS + 360 ))
          while [ $SECONDS -lt $DEADLINE ]; do
            STATUS=$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$STATUS" = "1" ] && { printf '\nBoot OK.\n'; break; }
            printf '.' && sleep 10
          done

      - name: post-boot
        run: |
          # Không kill server — chỉ connect thẳng vào ADB port của emulator
          adb start-server
          sleep 2

          # Force connect vào emulator port 5555 (emulator -port 5554 → ADB port 5555)
          printf 'Connecting ADB'
          DEADLINE=$(( SECONDS + 120 ))
          while [ $SECONDS -lt $DEADLINE ]; do
            adb connect localhost:5555 > /dev/null 2>&1 || true
            STATE=$(adb -s localhost:5555 get-state 2>/dev/null | tr -d '\r')
            if [ "$STATE" = "device" ]; then
              printf '\nADB online.\n'
              break
            fi
            printf '.' && sleep 5
          done

          # Root — ignore "already root" error
          adb -s localhost:5555 root 2>/dev/null || true
          sleep 3
          adb connect localhost:5555 > /dev/null 2>&1 || true
          sleep 2

          # Permissive SELinux — required for LD_PRELOAD to function
          adb -s localhost:5555 shell setenforce 0 2>/dev/null || true

          # S23 screen geometry
          adb -s localhost:5555 shell wm size 1080x2340
          adb -s localhost:5555 shell wm density 450

          # Kill all animations
          adb -s localhost:5555 shell settings put global window_animation_scale 0.0
          adb -s localhost:5555 shell settings put global transition_animation_scale 0.0
          adb -s localhost:5555 shell settings put global animator_duration_scale 0.0

          # Fake /proc/cpuinfo → Snapdragon 8 Gen 2 (SM8550) Cortex layout
          python3 << 'PY'
          cores = [
              ('0', 'Cortex-X3',   '0xd0e', '0x0'),
              ('1', 'Cortex-A715', '0xd81', '0x0'),
              ('2', 'Cortex-A715', '0xd81', '0x0'),
              ('3', 'Cortex-A510', '0xd46', '0x1'),
          ]
          blocks = []
          for idx, model, part, variant in cores:
              blocks.append(
                  f'processor\t: {idx}\n'
                  f'model name\t: {model}\n'
                  f'BogoMIPS\t: 38.40\n'
                  f'Features\t: fp asimd evtstrm aes pmull sha1 sha2 crc32 atomics fphp asimdhp cpuid asimdrdm lrcpc dcpop asimddp\n'
                  f'CPU implementer\t: 0x41\n'
                  f'CPU architecture: 8\n'
                  f'CPU variant\t: {variant}\n'
                  f'CPU part\t: {part}\n'
                  f'CPU revision\t: 1\n'
              )
          content = '\n'.join(blocks)
          content += '\nHardware\t: Qualcomm Technologies, Inc SM8550\n'
          with open('/tmp/fake_cpuinfo', 'w') as f:
              f.write(content)
          PY

          adb -s localhost:5555 push /tmp/fake_cpuinfo /data/local/tmp/cpuinfo
          adb -s localhost:5555 shell \
            'mount --bind /data/local/tmp/cpuinfo /proc/cpuinfo' 2>/dev/null || true

          # Unlock screen
          adb -s localhost:5555 shell input keyevent 224
          sleep 1
          adb -s localhost:5555 shell input swipe 540 1800 540 800

          echo "Device ready."

      - name: start-vnc
        run: |
          x11vnc \
            -display :99 \
            -nopw \
            -listen 127.0.0.1 \
            -rfbport 5901 \
            -forever \
            -quiet \
            -shared \
            -noncache \
            &
          sleep 3

      - name: start-novnc
        run: |
          websockify \
            --web /usr/share/novnc \
            127.0.0.1:6080 \
            127.0.0.1:5901 \
            &
          sleep 3

      # Auth proxy: password never echoed — read only from secret, hashed in Python
      - name: setup-auth-proxy
        env:
          VNC_PASS: ${{ secrets.VNC_PASS }}
        run: |
          python3 << 'PY'
          import subprocess, os, stat

          pw = os.environ['VNC_PASS']
          r = subprocess.run(
              ['openssl', 'passwd', '-apr1', '-stdin'],
              input=pw.encode(),
              capture_output=True,
              timeout=10,
          )
          hashed = r.stdout.decode().strip()

          with open('/tmp/.htpw', 'w') as f:
              f.write(f'android:{hashed}\n')
          os.chmod('/tmp/.htpw', stat.S_IRUSR | stat.S_IWUSR)
          PY

          sudo mv /tmp/.htpw /etc/nginx/.htpasswd
          sudo chmod 640 /etc/nginx/.htpasswd

          python3 << 'PY'
          # Build nginx config in Python to avoid shell-variable conflicts
          cfg = (
              "server {\n"
              "    listen 80 default_server;\n"
              "    listen [::]:80 default_server;\n"
              "\n"
              "    auth_basic \"Session Required\";\n"
              "    auth_basic_user_file /etc/nginx/.htpasswd;\n"
              "\n"
              "    location / {\n"
              "        proxy_pass http://127.0.0.1:6080;\n"
              "        proxy_http_version 1.1;\n"
              "        proxy_set_header Upgrade $http_upgrade;\n"
              "        proxy_set_header Connection \"upgrade\";\n"
              "        proxy_set_header Host $host;\n"
              "        proxy_cache_bypass $http_upgrade;\n"
              "        proxy_read_timeout 86400s;\n"
              "        proxy_send_timeout 86400s;\n"
              "    }\n"
              "}\n"
          )
          with open('/tmp/novnc.conf', 'w') as f:
              f.write(cfg)
          PY

          sudo cp /tmp/novnc.conf /etc/nginx/sites-available/novnc
          sudo ln -sf /etc/nginx/sites-available/novnc /etc/nginx/sites-enabled/novnc
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t && sudo systemctl restart nginx

      - name: start-tunnel
        run: |
          # localhost.run — zero-install SSH tunnel, outputs HTTPS URL
          ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o ExitOnForwardFailure=yes \
            -R 80:localhost:80 \
            nokey@localhost.run \
            > /tmp/tunnel.log 2>&1 &

          sleep 10

          URL=$(grep -oP 'https://\S+\.lhrtunnel\.link' /tmp/tunnel.log | head -1)
          [ -z "$URL" ] && URL=$(grep -oP 'https://\S+' /tmp/tunnel.log | head -1)

          if [ -n "$URL" ]; then
            printf '\n========================================\n'
            printf 'URL   : %s\n' "$URL"
            printf 'User  : android\n'
            printf 'Pass  : (your configured VNC_PASS)\n'
            printf '========================================\n\n'
          else
            printf 'Tunnel log:\n'
            cat /tmp/tunnel.log
          fi

      - name: keepalive
        run: |
          SECS=$(( ${{ github.event.inputs.duration }} * 60 ))
          printf 'Session active for %s min.\n' "${{ github.event.inputs.duration }}"
          sleep "$SECS"
